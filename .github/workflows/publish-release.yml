name: Publish CZATeria Plus Android v0.6.3

on:
  push:
    branches: [main]
    paths:
      - '.release-trigger-v0.6.3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified APK
        run: |
          curl -L --fail --retry 5 --retry-delay 3 \
            "https://raw.githubusercontent.com/Swir/XBookmark/czateria-plus-mobile-99/dist/Czateria_PLUS_Android_v0.6.3.apk" \
            -o Czateria_PLUS_Android_v0.6.3.apk
          echo "2437fab6cff48bd9d2f0928e80cd734047ae9bbc2a6efcef69585c56eddd27a0  Czateria_PLUS_Android_v0.6.3.apk" | sha256sum -c -

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.6.3 >/dev/null 2>&1; then
            gh release upload v0.6.3 Czateria_PLUS_Android_v0.6.3.apk --clobber
            gh release edit v0.6.3 --title "CZATeria Plus Android v0.6.3" --notes-file RELEASE_NOTES.md --latest
          else
            gh release create v0.6.3 Czateria_PLUS_Android_v0.6.3.apk \
              --title "CZATeria Plus Android v0.6.3" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
