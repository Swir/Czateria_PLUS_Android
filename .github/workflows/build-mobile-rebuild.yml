name: Build mobile-rebuild test APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Check mobile JavaScript
        run: node --check app/src/main/assets/mobile_adapter.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/CZATeria-Plus-Mobile-Settings-0.9.0-TEST.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CZATeria-Plus-Mobile-Settings-0.9.0-TEST
          path: android/app/build/outputs/apk/debug/CZATeria-Plus-Mobile-Settings-0.9.0-TEST.apk
          if-no-files-found: error
